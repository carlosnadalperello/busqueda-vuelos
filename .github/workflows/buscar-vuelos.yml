name: Buscar vuelos

on:
  schedule:
    - cron: "17 6 * * *"   # todos los días a las 06:17 UTC (07:17 / 08:17 en España)
  workflow_dispatch: {}      # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write            # para guardar estado.json e historial.csv en el repositorio

concurrency:
  group: buscar-vuelos
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar vuelos
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MAX_BUSQUEDAS_DIA: "8"
          MAX_BUSQUEDAS_MES: "240"
          TZ: Europe/Madrid
        run: python buscar_vuelos.py

      - name: Guardar estado e historial
        if: always()
        run: |
          git config user.name "buscador-vuelos"
          git config user.email "actions@users.noreply.github.com"
          git add estado.json historial.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Estado de la búsqueda $(date +%F)"
          git push
